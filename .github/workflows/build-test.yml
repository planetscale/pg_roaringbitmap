name: Build and test
on:
  push: # Run on any push
  pull_request: # Run on PRs
  merge_group:
permissions:
  contents: read
# Source build + `make installcheck` (pgxn-tools resolves the newest PGDG
# build of each major, so PG 19 tracks the current beta). The pinned,
# authoritative builds and tests are in packages.yml.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18, 19]
    container:
      image: pgxn/pgxn-tools
    steps:
      - name: Start PostgreSQL ${{ matrix.pg }}
        run: pg-start ${{ matrix.pg }}

      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build & test extension
        run: pg-build-test
